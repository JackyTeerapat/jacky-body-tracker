name: Validate Body Tracker

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/scans.ndjson'
      - 'assets/source/**'
      - 'assets/chart-display-fix.js'
      - 'assets/layout-hierarchy.js'
      - 'assets/trend-rebuild.js'
      - 'scripts/add-fitdays-scan.mjs'
      - 'scripts/tracker-lib.mjs'
      - 'scripts/validate-tracker.mjs'
      - '.github/workflows/validate-tracker.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'data/scans.ndjson'
      - 'assets/source/**'
      - 'assets/chart-display-fix.js'
      - 'assets/layout-hierarchy.js'
      - 'assets/trend-rebuild.js'
      - 'scripts/add-fitdays-scan.mjs'
      - 'scripts/tracker-lib.mjs'
      - 'scripts/validate-tracker.mjs'
      - '.github/workflows/validate-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tracker data and UI scripts
        run: node scripts/validate-tracker.mjs
