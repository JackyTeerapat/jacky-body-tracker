<!-- ============================================================
  JACKY BODY TRACKER v7
  ✅ แก้ได้อย่างเดียว: เพิ่ม 1 บรรทัดใน DATA ด้านล่าง
  ❌ ห้ามแก้: ทุกอย่างนอกจาก DATA, TARGET, TOTAL_DAYS
============================================================ -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacky Body Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #f0f0f0; padding: 2rem; }

  #app { max-width: 520px; margin: 0 auto; }
  .card { background: #1a1a1a; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 1rem; }
  .cl { font-size: 11px; color: #888; margin-bottom: 4px; }
  .cv { font-size: 22px; font-weight: 500; }
  .cd { font-size: 12px; margin-top: 2px; }
  .g { color: #1D9E75; } .r { color: #E24B4A; } .gr { color: #888; }
  .sec { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
  .mb { margin-bottom: 1rem; }
  table { width: 100%; font-size: 11px; border-collapse: collapse; }
  th { color: #555; text-align: left; padding: 5px 6px; border-bottom: 0.5px solid #333; white-space: nowrap; }
  td { padding: 5px 6px; border-bottom: 0.5px solid #222; white-space: nowrap; }
  .legend { display: flex; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  .li { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #888; }
  .ld { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
  /* Mobile-first reading layer. The original tracker stays as the data source. */
  :root {
    --ink: #182326;
    --muted: #718084;
    --line: #dce5e3;
    --paper: #f5f8f7;
    --surface: #ffffff;
    --teal: #2bb9b3;
    --teal-deep: #147d7a;
    --teal-soft: #e2f5f3;
    --coral: #ef7c67;
    --coral-soft: #fff0eb;
    --amber: #e6a944;
    --shadow: 0 18px 42px rgba(31, 69, 68, .08);
  }

  html { background: var(--paper); }
  body {
    padding: 0 !important;
    overflow-x: hidden;
    background: var(--paper) !important;
    color: var(--ink) !important;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans Thai", "Segoe UI", sans-serif;
  }
  #app { display: none !important; }
  .mobile-shell { min-height: 100vh; padding: 18px 16px 54px; }
  .mobile-wrap { width: min(100%, 1080px); margin: 0 auto; }
  .m-topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .m-eyebrow { margin: 0 0 5px; color: var(--teal-deep); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  .m-topbar h1 { margin: 0; color: var(--ink); font-size: clamp(26px, 8vw, 40px); line-height: .98; letter-spacing: -.055em; }
  .m-stamp { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .m-score { flex: 0 0 auto; min-width: 78px; padding: 10px 10px 9px; border: 1px solid #bce6e2; border-radius: 18px; background: var(--teal-soft); text-align: center; }
  .m-score span, .m-score small { display: block; color: var(--teal-deep); font-size: 10px; font-weight: 700; }
  .m-score strong { display: inline-block; margin: 1px 0 0; color: var(--teal-deep); font-size: 34px; line-height: 1; letter-spacing: -.06em; }
  .m-score small { display: inline; margin-left: 2px; font-size: 11px; }
  .m-hero { position: relative; overflow: hidden; margin-bottom: 12px; padding: 20px; border-radius: 26px; background: var(--ink); color: #fff; box-shadow: var(--shadow); }
  .m-hero::before { position: absolute; top: 0; right: 0; width: 46%; height: 100%; background: linear-gradient(120deg, transparent, rgba(43,185,179,.26)); content: ""; pointer-events: none; }
  .m-hero::after { position: absolute; top: 18px; right: 20px; width: 7px; height: 76px; border-radius: 7px; background: var(--teal); content: ""; opacity: .9; }
  .m-kicker { position: relative; margin-bottom: 16px; color: #8edbd6; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  .m-hero-main { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
  .m-weight { color: #fff; font-size: clamp(46px, 15vw, 72px); font-weight: 750; line-height: .9; letter-spacing: -.075em; }
  .m-weight span { color: #9aaeb0; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .m-hero-label { margin: 8px 0 0; color: #a9b8b9; font-size: 12px; }
  .m-target { position: relative; min-width: 118px; padding: 11px 12px; border: 1px solid rgba(255,255,255,.13); border-radius: 15px; background: rgba(255,255,255,.07); }
  .m-target span, .m-target small { display: block; color: #9eafb0; font-size: 10px; }
  .m-target strong { display: block; margin: 3px 0; color: #fff; font-size: 19px; }
  .m-target small { color: #8edbd6; font-size: 11px; }
  .m-progress { position: relative; height: 8px; margin: 22px 0 9px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.13); }
  .m-progress > i { display: block; width: var(--progress); height: 100%; border-radius: inherit; background: var(--teal); }
  .m-hero-foot { position: relative; display: flex; justify-content: space-between; gap: 12px; color: #a9b8b9; font-size: 11px; }
  .m-good { color: #8edbd6; }
  .m-section { margin-top: 24px; }
  .m-section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 2px 10px; }
  .m-section-head h2 { margin: 0; color: var(--ink); font-size: 19px; letter-spacing: -.04em; }
  .m-section-note { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
  .m-pill { flex: 0 0 auto; padding: 6px 9px; border-radius: 999px; background: var(--teal-soft); color: var(--teal-deep); font-size: 10px; font-weight: 800; }
  .m-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .m-metric { min-height: 118px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 24px rgba(31,69,68,.04); }
  .m-metric:nth-child(3) { grid-column: 1 / -1; min-height: 98px; }
  .m-metric-label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
  .m-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
  .m-dot.coral { background: var(--coral); }
  .m-dot.amber { background: var(--amber); }
  .m-metric-value { margin-top: 13px; color: var(--ink); font-size: 28px; font-weight: 750; line-height: 1; letter-spacing: -.06em; }
  .m-metric-value span { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: -.02em; }
  .m-metric-foot { margin-top: 7px; color: var(--muted); font-size: 11px; }
  .m-metric-foot.good { color: var(--teal-deep); }
  .m-chart-card { padding: 13px 12px 10px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
  .m-chart-title { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; color: var(--ink); font-size: 12px; font-weight: 750; }
  .m-chart-title span { color: var(--muted); font-size: 10px; font-weight: 500; }
  .m-chart { position: relative; height: 168px; }
  .m-chart + .m-chart-title { margin-top: 18px; }
  .m-report-grid { display: grid; gap: 10px; }
  .m-report-card { padding: 15px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
  .m-report-card h3 { margin: 0 0 11px; color: var(--ink); font-size: 13px; }
  .m-data-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #edf1f0; }
  .m-data-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .m-data-row:first-of-type { padding-top: 0; }
  .m-data-row span { color: var(--muted); font-size: 11px; }
  .m-data-row strong { color: var(--ink); font-size: 13px; text-align: right; }
  .m-data-row em { color: var(--teal-deep); font-size: 10px; font-style: normal; }
  .m-indicator-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .m-indicator { padding: 12px; border-radius: 14px; background: #f2f7f6; }
  .m-indicator span { display: block; color: var(--muted); font-size: 10px; }
  .m-indicator strong { display: block; margin-top: 5px; color: var(--ink); font-size: 18px; letter-spacing: -.04em; }
  .m-segment-grid { display: grid; gap: 8px; }
  .m-segment { padding: 13px 14px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
  .m-segment-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .m-segment-top strong { font-size: 13px; }
  .m-segment-top span { color: var(--coral); font-size: 10px; font-weight: 700; }
  .m-segment-lines { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .m-segment-line { padding: 9px 10px; border-radius: 12px; background: var(--coral-soft); }
  .m-segment-line.muscle { background: #edf7fb; }
  .m-segment-line small { display: block; color: var(--muted); font-size: 9px; }
  .m-segment-line b { display: block; margin-top: 3px; color: var(--ink); font-size: 18px; letter-spacing: -.05em; }
  .m-segment-line b span { color: var(--muted); font-size: 10px; letter-spacing: 0; }
  .m-segment-line em { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-style: normal; }
  .m-history { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
  .m-history-row { display: grid; grid-template-columns: 1.15fr .9fr .9fr .9fr; gap: 6px; align-items: center; padding: 11px 13px; border-bottom: 1px solid #edf1f0; font-size: 11px; }
  .m-history-row:last-child { border-bottom: 0; }
  .m-history-row.header { color: var(--muted); background: #f2f7f6; font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .m-history-row strong { color: var(--ink); font-size: 12px; }
  .m-history-row span { color: var(--muted); text-align: right; }
  .m-history-row .down { color: var(--teal-deep); }
  .m-footnote { margin: 22px 3px 0; color: #8b9899; font-size: 10px; line-height: 1.6; }
  .m-disclaimer { display: inline-block; margin-top: 8px; padding: 5px 8px; border-radius: 7px; background: #fff5df; color: #916c28; }
  details.m-details { margin-top: 10px; }
  details.m-details summary { cursor: pointer; color: var(--teal-deep); font-size: 11px; font-weight: 700; }
  @media (min-width: 720px) {
    .mobile-shell { padding: 34px 28px 72px; }
    .m-topbar { margin-bottom: 24px; }
    .m-dashboard { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr); gap: 14px; align-items: start; }
    .m-dashboard > .m-main-column { min-width: 0; }
    .m-dashboard > .m-side-column { min-width: 0; }
    .m-metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .m-metric:nth-child(3) { grid-column: auto; }
    .m-report-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .m-segment-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .m-hero, .m-metric, .m-report-card, .m-segment { animation: m-rise .45s ease both; }
    .m-metric:nth-child(2) { animation-delay: 55ms; }
    .m-metric:nth-child(3) { animation-delay: 100ms; }
    @keyframes m-rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
  }

  /* Summary-first refresh: one selected period drives the comparison view. */
  #mobile-app { display: none !important; }
  #summary-app { width: 100%; max-width: 100vw; overflow-x: hidden; }
  .summary-shell { min-height: 100vh; padding: 16px 16px 48px; background: #f4f8f6; color: #172426; }
  .summary-wrap { width: 100%; max-width: 760px; margin: 0 auto; }
  .s-header { display: flex; min-width: 0; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .s-eyebrow { margin: 0 0 9px; color: #177b78; font-size: 10px; font-weight: 800; line-height: 1.2; letter-spacing: .12em; text-transform: uppercase; }
  .s-header h1 { margin: 0; color: #172426; font-size: clamp(30px, 9vw, 44px); line-height: 1.08; letter-spacing: -.065em; }
  .s-date { margin: 10px 0 0; color: #758487; font-size: 12px; }
  .s-score { flex: 0 0 auto; min-width: 76px; padding: 10px 9px 8px; border-radius: 17px; background: #dff4f1; text-align: center; }
  .s-score small { display: block; color: #177b78; font-size: 9px; font-weight: 800; letter-spacing: .08em; }
  .s-score strong { color: #126f6d; font-size: 34px; line-height: 1; letter-spacing: -.08em; }
  .s-score span { color: #177b78; font-size: 11px; }
  .s-verdict { position: relative; overflow: hidden; margin-bottom: 11px; padding: 20px; border-radius: 24px; background: #172426; color: #fff; box-shadow: 0 16px 34px rgba(23,36,38,.14); }
  .s-verdict::before, .s-verdict::after { display: none; }
  .s-verdict-label { position: relative; margin: 0 0 10px 3px; color: #8edbd6; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .s-verdict h2 { position: relative; max-width: 82%; margin: 0; color: #fff; font-size: clamp(25px, 7vw, 36px); line-height: 1.05; letter-spacing: -.06em; }
  .s-verdict p { position: relative; max-width: 90%; margin: 10px 0 0 3px; color: #b1c0c0; font-size: 12px; line-height: 1.5; }
  .s-verdict-action { margin-top: 13px !important; padding: 10px 11px; border-radius: 12px; background: #eef8f6; color: #176e6a !important; font-weight: 700; }
  .s-verdict-encourage { margin-top: 11px !important; color: #177b78 !important; font-weight: 800; }
  .s-chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 3px; }
  .s-chart-head h3 { margin: 0; color: #172426; font-size: 13px; }
  .s-chart-head span { color: #758487; font-size: 10px; }
  .s-chart { position: relative; height: 145px; margin-top: 7px; }
  .s-details { margin-top: 14px; padding: 14px 2px 0; border-top: 1px solid #dbe7e4; }
  .s-details-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .s-details-head h3 { margin: 0; color: var(--ink); font-size: 16px; letter-spacing: -.04em; }
  .s-details-head > span { flex: 0 0 auto; color: var(--teal-deep); font-size: 10px; font-weight: 800; }
  .s-detail-comparison { margin-top: 12px; border-top: 1px solid #dfe9e6; }
  .s-detail-compare-row { display: grid; grid-template-columns: minmax(74px, 1fr) auto minmax(124px, auto); align-items: center; gap: 10px; padding: 10px 0; }
  .s-detail-compare-row + .s-detail-compare-row { border-top: 1px solid #edf2f0; }
  .s-detail-compare-label { color: var(--muted); font-size: 11px; }
  .s-detail-compare-current { color: var(--ink); font-size: 12px; font-weight: 800; text-align: right; }
  .s-detail-compare-current small { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; font-weight: 500; }
  .s-detail-compare-change { font-size: 11px; font-weight: 800; text-align: right; }
  .s-detail-compare-change.down { color: var(--teal-deep); }
  .s-detail-compare-change.up { color: var(--coral); }
  .s-detail-compare-change.steady { color: var(--muted); }
  .s-detail-range-note { margin: 7px 0 0; color: var(--muted); font-size: 10px; line-height: 1.35; }
  #s-detail-content { margin-top: 11px; }
  .s-detail-card { margin-bottom: 9px; padding: 14px; border: 1px solid #dbe7e4; border-radius: 17px; background: #fff; }
  .s-detail-card h3 { margin: 0 0 10px; color: #172426; font-size: 13px; }
  .s-detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #edf2f0; font-size: 11px; }
  .s-detail-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .s-detail-row span { color: #758487; }
  .s-detail-row strong { color: #172426; text-align: right; }
  .s-detail-row strong em { margin-left: 4px; color: var(--teal-deep); font-size: 10px; font-style: normal; font-weight: 700; white-space: nowrap; }
  .s-detail-row strong em.up { color: var(--coral); }
  .s-detail-row strong em.s-inline-note { color: var(--muted); font-weight: 600; }
  .s-segment-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .s-segment-item { padding: 10px; border-radius: 12px; background: #f0f7f5; }
  .s-segment-item span { display: block; color: #758487; font-size: 10px; }
  .s-segment-values { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 7px; }
  .s-segment-values > div { min-width: 0; }
  .s-segment-values small { display: block; margin: 0; color: #758487; font-size: 9px; }
  .s-segment-values strong { display: block; margin-top: 3px; color: #172426; font-size: 13px; line-height: 1.1; }
  .s-segment-values em { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; font-style: normal; line-height: 1.2; }
  .s-segment-values em.down { color: var(--teal-deep); }
  .s-segment-values em.up { color: var(--coral); }
  .s-detail-range-label { padding: 4px 7px; border: 1px solid #bce6e2; border-radius: 999px; background: var(--teal-soft); }
  .s-segment-card-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .s-segment-card-head h3 { margin-bottom: 0; }
  .s-segment-card-head span { color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .08em; }
  .s-body-map { --map-figure-width: 220px; --map-figure-height: 350px; --map-connector: 220px; position: relative; min-height: 382px; margin-top: 9px; overflow: hidden; border-radius: 15px; background: radial-gradient(circle at 50% 35%, #ffffff 0, #f5faf8 64%, #edf5f2 100%); }
  .s-body-map::before { position: absolute; inset: 12px; border: 1px dashed #dbe8e4; border-radius: 12px; content: ""; pointer-events: none; }
  .s-body-map img { position: absolute; z-index: 1; top: 14px; left: 50%; width: var(--map-figure-width); height: var(--map-figure-height); object-fit: contain; transform: translateX(-50%); }
  .s-segment-callout { --pointer-y: 50%; position: absolute; z-index: 2; width: 128px; padding: 9px 10px; border: 1px solid #d5e3df; border-radius: 12px; background: rgba(255,255,255,.95); box-shadow: 0 5px 14px rgba(31,69,68,.07); }
  .s-segment-callout::after { position: absolute; top: var(--pointer-y); width: var(--map-connector); border-top: 1px solid #8fc1b9; content: ""; transform: translateY(-50%); }
  .s-segment-callout::before { position: absolute; top: var(--pointer-y); width: 6px; height: 6px; border: 1px solid #fff; border-radius: 50%; background: #6eada6; content: ""; transform: translateY(-50%); }
  .s-segment-callout.left::after { right: calc(-1 * var(--map-connector)); }
  .s-segment-callout.right::after { left: calc(-1 * var(--map-connector)); }
  .s-segment-callout.left::before { right: calc(-1 * var(--map-connector) - 3px); }
  .s-segment-callout.right::before { left: calc(-1 * var(--map-connector) - 3px); }
  .s-segment-callout h4 { margin: 0 0 4px; color: var(--ink); font-size: 10px; line-height: 1.1; }
  .s-segment-callout small { display: block; color: var(--muted); font-size: 9px; line-height: 1.35; white-space: nowrap; }
  .s-segment-callout small:first-of-type { color: #c26453; }
  .s-segment-callout small:nth-of-type(2) { color: #317d9a; }
  .s-segment-callout small em { margin-left: 2px; color: inherit; font-style: normal; }
  .s-segment-callout.la, .s-segment-callout.ra { --pointer-y: 88%; --map-connector: 172px; }
  .s-segment-callout.tr { --pointer-y: 88%; --map-connector: 190px; }
  .s-segment-callout.ll, .s-segment-callout.rl { --pointer-y: 42%; --map-connector: 180px; }
  .s-segment-callout.la { top: 63px; right: 10px; }
  .s-segment-callout.ra { top: 63px; left: 10px; }
  .s-segment-callout.tr { top: 123px; left: 10px; }
  .s-segment-callout.ll { top: 178px; right: 10px; }
  .s-segment-callout.rl { top: 178px; left: 10px; }
  .s-footer { margin: 22px 2px 0; color: #8a9899; font-size: 10px; line-height: 1.6; }
  @media (min-width: 680px) {
    .summary-shell { padding: 34px 28px 64px; }
    .summary-wrap { width: min(100%, 760px); }
    .s-header { margin-bottom: 22px; }
    .s-verdict { padding: 24px; }
    .s-key strong { font-size: 29px; }
    .s-chart { height: 190px; }
  }

  /* Summary controls and goals: make the comparison useful without adding another report wall. */
  .s-header-copy { min-width: 0; flex: 1 1 auto; padding-top: 2px; }
  .s-header .s-eyebrow { margin-bottom: 10px; line-height: 1.2; }

    const vals = segD.map(d => d.sf[p.key]);
    return {...p, range: +(Math.max(...vals)-Math.min(...vals)).toFixed(1)};
  }).sort((a,b) => b.range - a.range);
  const muscleRanges = partsP.map(p => {
    const vals = segD.map(d => d.sm[p.key]);
    return {...p, range: +(Math.max(...vals)-Math.min(...vals)).toFixed(1)};
  }).sort((a,b) => b.range - a.range);

  const fatMoverCount = {}, muscleMoverCount = {};
  partsP.forEach(p => { fatMoverCount[p.key] = 0; muscleMoverCount[p.key] = 0; });
  for (let i = 1; i < segD.length; i++) {
    const prev = segD[i-1], cur = segD[i];
    const fchanges = partsP.map(p => ({k:p.key, d:Math.abs(+(cur.sf[p.key]-prev.sf[p.key]).toFixed(1))}));

    const bM = mchanges.reduce((a,b) => a.d >= b.d ? a : b);
    if (bF.d > 0) fatMoverCount[bF.k]++;
    if (bM.d > 0) muscleMoverCount[bM.k]++;

      </div>
    </div>
    <div style="font-size:10px;color:#555;margin-bottom:6px">เปลี่ยนบ่อยสุด (${segD.length-1} วัน)</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:12px">
      ${partsP.map(p=>`<div style="text-align:center;background:#111;border-radius:6px;padding:5px 2px">
        <div style="font-size:9px;color:${p.key==='tr'?'#F5A623':'#555'};margin-bottom:3px">${p.label.replace('(ท้อง)','')}</div>

    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:10px">
      ${partsP.map(p=>{const fd=+(last2.sf[p.key]-first.sf[p.key]).toFixed(1);const md=+(last2.sm[p.key]-first.sm[p.key]).toFixed(1);return`<div style="text-align:center;background:#111;border-radius:6px;padding:5px 2px"><div style="font-size:9px;color:${p.key==='tr'?'#F5A623':'#555'};margin-bottom:3px">${p.label.replace('(ท้อง)','')}</div><div style="font-size:10px;color:${fd<0?'#1D9E75':fd>0?'#E24B4A':'#444'}">${fd>0?'+':''}${fd}f</div><div style="font-size:10px;color:${md>0?'#1D9E75':md<0?'#E24B4A':'#444'}">${md>0?'+':''}${md}m</div></div>`;}).join('')}
    </div>
    <div style="background:#1a1208;border-radius:8px;padding:8px">
