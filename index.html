<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jacky Body Tracker</title>
  <style>body{margin:0;background:#f6f8fb;color:#172033;font:16px system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}p{color:#667085}</style>
</head>
<body>
  <main><div><strong>กำลังเปิด Jacky Body Tracker…</strong><p>โหลดข้อมูลประวัติการสแกน</p></div></main>
  <script>
    const files=["assets/source/page-000.html","assets/source/page-001.html","assets/source/page-002.html","assets/source/page-003.html","assets/source/page-004.html","assets/source/page-025.html","assets/source/page-026.html","assets/source/page-005.html","assets/source/page-006.html","assets/source/page-007.html","assets/source/page-008.html","assets/source/page-009.html","assets/source/page-010.html","assets/source/page-011.html","assets/source/page-012.html","assets/source/page-013.html","assets/source/page-014.html","assets/source/page-015.html","assets/source/page-016.html","assets/source/page-017.html","assets/source/page-018.html","assets/source/page-019.html","assets/source/page-020.html","assets/source/page-021.html","assets/source/page-022.html","assets/source/page-023.html","assets/source/page-024.html"];
    const readText = async (file, cache = 'default') => {
      const response = await fetch(file, { cache });
      if (!response.ok) throw new Error(file);
      return response.text();
    };

    const PRIVATE_SCAN_API = 'https://qpecjtrwfuzdwrwksbdk.supabase.co/rest/v1/private_scans?select=scan&order=measured_at.asc';
    const PRIVATE_SCAN_KEY = 'sb_publishable_CucV7UnkqE7qTfnyr1rKqQ_qg-v_Zd7';
    const PRIVATE_ACCESS_STORAGE = 'jacky-body-tracker-access-key';

    const readPrivateScans = async () => {
      let accessKey = localStorage.getItem(PRIVATE_ACCESS_STORAGE) || '';
      if (!accessKey) {
        accessKey = window.prompt('กรอกรหัส Private Body Tracker เพื่อโหลดข้อมูลล่าสุด') || '';
        if (!accessKey) return [];
        localStorage.setItem(PRIVATE_ACCESS_STORAGE, accessKey);
      }

      const response = await fetch(PRIVATE_SCAN_API, {
        cache: 'no-store',
        headers: {
          apikey: PRIVATE_SCAN_KEY,
          'x-tracker-key': accessKey
        }
      });

      if (response.status === 401 || response.status === 403) {
        localStorage.removeItem(PRIVATE_ACCESS_STORAGE);
        console.warn('Private Body Tracker access key rejected');
        return [];
      }
      if (!response.ok) throw new Error('Private scan API');
      const rows = await response.json();
      return rows.map(row => row.scan).filter(Boolean);
    };

    Promise.all([
      Promise.all(files.map(file => readText(file))),
      readText('data/scans.ndjson', 'no-cache').catch(() => ''),
      readPrivateScans().catch(error => {
        console.warn(error);
        return [];
      })
    ]).then(([parts, scanText, privateScans]) => {
      const repoScans = String(scanText)
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => JSON.parse(line));

      const mergedScans = new Map();
      [...repoScans, ...privateScans].forEach(scan => {
        const key = scan.measuredAt || scan.sourceFile || scan.isoDate;
        if (key) mergedScans.set(key, scan);
      });
      const extraScans = [...mergedScans.values()].sort((a, b) =>
        String(a.measuredAt || a.isoDate).localeCompare(String(b.measuredAt || b.isoDate))
      );

      let source = parts.join('');
      if (extraScans.length) {
        const targetPos = source.indexOf('const TARGET');
        const closePos = source.lastIndexOf('];', targetPos);
        if (targetPos < 0 || closePos < 0) throw new Error('Cannot locate DATA tail');
        const before = source.slice(0, closePos).replace(/\s*$/, '');
        const after = source.slice(closePos);
        source = before + ',\n  ' + extraScans.map(scan => JSON.stringify(scan)).join(',\n  ') + '\n' + after;
      }

      source = source.replace(
        /const\s+LATEST_DATE\s*=\s*'[^']*'\s*;/,
        "const LATEST_DATE = DATA[DATA.length - 1]?.isoDate || '';"
      );

      // UI code is stable between scan uploads. Keep a fixed version so the browser can
      // cache these scripts; data/scans.ndjson is still fetched with no-cache above.
      const assetVersion = '20260923-detail-delta-fix-v1';
      source = source.replace(
        '</body>',
        '<script src="assets/chart-display-fix.js?v=' + assetVersion + '"></' + 'script>' +
        '<script src="assets/layout-hierarchy.js?v=' + assetVersion + '"></' + 'script>' +
        '<script src="assets/goal-progress-v2.js?v=' + assetVersion + '"></' + 'script>' +
        '<script src="assets/range-controls.js?v=' + assetVersion + '"></' + 'script>' +
        '<script src="assets/trend-rebuild.js?v=' + assetVersion + '"></' + 'script>' +
        '<script src="assets/detail-range-sync.js?v=' + assetVersion + '"></' + 'script></body>'
      );

      document.open();
      document.write(source);
      document.close();
    }).catch(error => {
      console.error(error);
      document.body.innerHTML='<main><div><strong>เปิดข้อมูลไม่สำเร็จ</strong><p>กรุณาลองรีเฟรชอีกครั้ง</p></div></main>';
    });
  </script>
</body>
</html>
